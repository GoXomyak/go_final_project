name: Go

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.24.x]
  
    steps:
    - uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.x'
        
    - name: Display Go version
      run: go version

    - name: Install dependencies
      run: go mod tidy

    - name: Create .env for CI
      run: |
        echo "TODO_PORT=7540" >> .env
        echo "WEB_DIR=./web" >> .env
        echo "TODO_DBFILE=./internal/data/scheduler.db" >> .env
        echo "TODO_SCHEMA_PATH=./internal/db/schema.sql" >> .env
        echo "TODO_PASSWORD=myPassword" >> .env
        echo "TODO_JWT_SECRET=lineForSignature" >> .env

    - name: Run local server
      run: |
        CGO_ENABLED=0 GOOS=linux go run main.go &
        sleep 100
        go test -run ^TestApp$ ./tests
        
        